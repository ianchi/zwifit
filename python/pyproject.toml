[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ifit-ble"
version = "0.1.0"
description = "BLE client and FTMS relay for iFit equipment"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "bleak>=2.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
ifit = "ifit_ble.cli:main"

[project.optional-dependencies]
ftms = [
    "bless>=0.3.0",
]
activation-discovery = [
    "bless>=0.3.0",
]
all = [
    "bless>=0.3.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
